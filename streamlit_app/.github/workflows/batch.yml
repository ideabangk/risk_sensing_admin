name: Risk Sensing - Auto Batch

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:         # 수동 실행 가능

jobs:
  batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create secrets file
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << 'EOF'
          [supabase]
          url = "${{ secrets.SUPABASE_URL }}"
          key = "${{ secrets.SUPABASE_KEY }}"

          [naver]
          client_id = "${{ secrets.NAVER_CLIENT_ID }}"
          client_secret = "${{ secrets.NAVER_CLIENT_SECRET }}"

          [dart]
          api_key = "${{ secrets.DART_API_KEY }}"
          EOF

      - name: Run batch collection
        run: python run_batch.py
        env:
          PYTHONPATH: .
